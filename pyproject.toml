[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "donewitness"
dynamic = ["version"]
description = "Deterministic, evidence-first acceptance verification for AI-written web software"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "DoneWitness contributors"}]
keywords = [
  "ai",
  "coding-agents",
  "verification",
  "testing",
  "playwright",
  "evidence",
  "ci",
]
dependencies = [
  "playwright>=1.61,<2",
  "pydantic>=2,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Drippinblood333/DoneWitness"
Repository = "https://github.com/Drippinblood333/DoneWitness"
Issues = "https://github.com/Drippinblood333/DoneWitness/issues"
Changelog = "https://github.com/Drippinblood333/DoneWitness/blob/main/CHANGELOG.md"
Security = "https://github.com/Drippinblood333/DoneWitness/security/policy"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
donewitness = "donewitness.cli:main"

[tool.setuptools.dynamic]
version = {attr = "donewitness.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["donewitness*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
